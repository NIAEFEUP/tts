name: Deploy

on:
  push:
    branches:
      - main
      - develop
      - beta

jobs:
  frontend:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Upload to NIployments register
        uses: NIAEFEUP/push-to-niployments@v2.3
        with:
          repository_name: tts-fe
          docker_dockerfile: Dockerfile
          docker_context: .
          docker_target: frontend-prod
          # Per-environment frontend config (base64 `.env`): it must set
          # VITE_APP_PROD=true, and VITE_APP_BACKEND_URL when the backend is not
          # same-origin. See apps/frontend/README.md#backend-url-per-environment.
          docker_build_args: |
            TTS_FE_VARS_METHOD=content-var
            TTS_FE_VARS_CONTENT=${{ secrets.TTS_FE_VARS_CONTENT }}
          NIPLOYMENTS_REGISTRY_URL: ${{ vars.NIPLOYMENTS_REGISTRY_URL }}
          NIPLOYMENTS_REGISTRY_USERNAME: ${{ vars.NIPLOYMENTS_REGISTRY_USERNAME }}
          NIPLOYMENTS_REGISTRY_PASSWORD: ${{ secrets.NIPLOYMENTS_REGISTRY_PASSWORD }}

  backend:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Upload to NIployments register
        uses: NIAEFEUP/push-to-niployments@v2.3
        with:
          repository_name: tts-be
          docker_dockerfile: Dockerfile
          docker_context: .
          docker_target: backend-prod
          NIPLOYMENTS_REGISTRY_URL: ${{ vars.NIPLOYMENTS_REGISTRY_URL }}
          NIPLOYMENTS_REGISTRY_USERNAME: ${{ vars.NIPLOYMENTS_REGISTRY_USERNAME }}
          NIPLOYMENTS_REGISTRY_PASSWORD: ${{ secrets.NIPLOYMENTS_REGISTRY_PASSWORD }}
