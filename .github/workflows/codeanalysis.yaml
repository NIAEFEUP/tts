name: Code analysis

on:
  pull_request:
    branches:
      - develop
      - main
      - beta
    types: [ready_for_review, synchronize, opened, reopened]

jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Typecheck & lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Prisma contract (contract.json + contract.d.ts) is git-ignored and
      # generated, so it must be emitted before anything that imports the client.
      # `bun run typecheck` also does this, but making the step explicit keeps CI
      # honest: the typecheck below always runs against the current contract.
      - name: Emit Prisma contract
        working-directory: apps/backend
        run: bun run contract:emit

      - name: Typecheck backend
        working-directory: apps/backend
        run: bun run typecheck

      # The tests are the only thing that boots `createApp()`, so they are the
      # only step that can catch runtime breakage — a module-resolution or
      # wiring regression typechecks cleanly and still fails at boot. They
      # need the generated contract, which the emit step above provides.
      - name: Test backend
        working-directory: apps/backend
        run: bun run test

      - name: Typecheck frontend
        working-directory: apps/frontend
        run: bun run typecheck

      - name: Typecheck sigarra
        working-directory: packages/sigarra
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check
