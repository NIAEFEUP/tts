on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  deploy:
    name: 'Wait for Netlify Preview'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Netlify Preview
        uses: kamranayub/wait-for-netlify-action@v2.1.1
        id: waitForNetlify
        continue-on-error: true
        with:
          site_name: 'tts-fe-preview'
          max_timeout: 300
          verbose: true
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.waitForNetlify.outputs.url != ''
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🌐 **Netlify Preview disponível:**\n${{ steps.waitForNetlify.outputs.url }}`
            });
